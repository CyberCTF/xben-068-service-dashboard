# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-068-24 Service Dashboard (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask dashboard that reports whether named services are running. The flag is in FLAG.txt on the server.
# The benchmark folder benchmarks/XBEN-068-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-068-service-dashboard

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.111.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the Service Dashboard page answers
    http: http://web:80/
    wait: 180
  - name: the service check answers in JSON
    script: checks/probe.sh
    wait: 60

message: |
  Service Dashboard answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The dashboard checks services by name. How is a status verified? Try other service names.
